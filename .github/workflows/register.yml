# 소유자 승인 등재(신뢰 경계).
# - main의 이 workflow와 scripts/만 실행한다. PR commit은 데이터로만 읽고, PR의 workflow·스크립트·도구는 실행하지 않는다.
# - inspect job(contents: read): 새 버전마다 Release 자산을 한 번 받아 같은 byte로 공개 도구 검사·대조·해시 계산.
# - commit job(environment catalog-register, 소유자 승인): job summary의 고정 값을 본 뒤 승인하면 item.json에 기록한다.
name: register

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 등재 PR 번호
        required: true
        type: number
      headSha:
        description: 소유자가 검토한 PR head commit(40자)
        required: true
        type: string
      allowRepositoryTransfer:
        description: 등재된 항목의 repository 이전을 허용
        required: false
        type: boolean
        default: false

concurrency:
  group: catalog-register
  cancel-in-progress: false

permissions: {}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ inputs.headSha }}
      ALLOW_TRANSFER: ${{ inputs.allowRepositoryTransfer }}
    steps:
      - name: main checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: PR commit 확인과 가져오기(데이터)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "pr 형식이 잘못됐다"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "headSha는 40자 소문자 hex여야 한다"; exit 1; }
          read -r state base head author < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.state, .base.ref, .head.sha, .user.login] | @tsv')
          [ "$state" = open ] || { echo "열린 PR이 아니다"; exit 1; }
          [ "$base" = main ] || { echo "main 대상 PR이 아니다"; exit 1; }
          [ "$head" = "$HEAD_SHA" ] || { echo "PR head가 검토한 commit과 다르다: $head"; exit 1; }
          [[ "$author" =~ ^[A-Za-z0-9-]{1,39}(\[bot\])?$ ]] || { echo "PR 작성자 형식이 잘못됐다"; exit 1; }
          echo "author=$author" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] || { echo "가져온 PR head가 다르다"; exit 1; }

      - name: Release 상태 확인(공개, draft·prerelease 아님)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          transfer=()
          if [ "$ALLOW_TRANSFER" = true ]; then transfer=(--allow-repository-transfer); fi
          node scripts/check-releases.mjs --head-sha "$HEAD_SHA" "${transfer[@]}"

      - name: 공개 도구 키트(tools.lock.json 고정)
        run: node scripts/fetch-tools.mjs "$RUNNER_TEMP/tools"

      # 공개 도구를 실행하는 step이므로 토큰을 넘기지 않는다.
      - name: 받기·검사·고정 값 계산
        env:
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          set -euo pipefail
          transfer=()
          if [ "$ALLOW_TRANSFER" = true ]; then transfer=(--allow-repository-transfer); fi
          node scripts/register-inspect.mjs --head-sha "$HEAD_SHA" --tools "$RUNNER_TEMP/tools" \
            --run-id "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/fixed-values.json" --pr-author "$PR_AUTHOR" "${transfer[@]}"

      - name: 고정 값 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixed-values
          path: ${{ runner.temp }}/fixed-values.json
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: inspect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: catalog-register
    permissions:
      contents: read
      actions: read
    env:
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ inputs.headSha }}
      ALLOW_TRANSFER: ${{ inputs.allowRepositoryTransfer }}
    steps:
      - name: 등재 App 토큰
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 최신 main checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: PR commit 다시 확인과 가져오기(데이터)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          read -r state base head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.state, .base.ref, .head.sha] | @tsv')
          [ "$state" = open ] || { echo "열린 PR이 아니다"; exit 1; }
          [ "$base" = main ] || { echo "main 대상 PR이 아니다"; exit 1; }
          [ "$head" = "$HEAD_SHA" ] || { echo "승인 사이에 PR head가 바뀌었다: $head"; exit 1; }
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] || exit 1

      - name: Release 상태 다시 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          transfer=()
          if [ "$ALLOW_TRANSFER" = true ]; then transfer=(--allow-repository-transfer); fi
          node scripts/check-releases.mjs --head-sha "$HEAD_SHA" "${transfer[@]}"

      - name: 고정 값 artifact 받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixed-values
          path: ${{ runner.temp }}/artifact

      - name: artifact 검증·재확인·항목 폴더 쓰기
        run: |
          set -euo pipefail
          transfer=()
          if [ "$ALLOW_TRANSFER" = true ]; then transfer=(--allow-repository-transfer); fi
          node scripts/register-commit.mjs --head-sha "$HEAD_SHA" --artifact "$RUNNER_TEMP/artifact/fixed-values.json" \
            --run-id "$GITHUB_RUN_ID" --message-out "$RUNNER_TEMP/message.txt" "${transfer[@]}"

      - name: commit·push·PR 닫기
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add --all -- items
          outside=$(git diff --cached --name-only | grep -v '^items/' || true)
          [ -z "$outside" ] || { echo "항목 폴더 밖 변경: $outside"; exit 1; }
          git commit --file "$RUNNER_TEMP/message.txt"
          git push origin HEAD:main
          sha=$(git rev-parse HEAD)
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" \
            --comment "등재했습니다: https://github.com/$GITHUB_REPOSITORY/commit/$sha"
